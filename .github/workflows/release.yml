# Reusable workflow: create ONE consolidated GitHub Release per deploy.
#
# Creates a single git tag (deploy-{env}-{TS}-{sha}) and a GitHub Release
# with a conventional-commits changelog showing commits since the last
# consolidated deploy of the same environment.
#
# Called by deploy.yml after all deploy jobs complete.

name: Release

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      timestamp:
        required: true
        type: string
      deploy-app:
        required: true
        type: string
      deploy-studio:
        required: true
        type: string
      deploy-admin:
        required: true
        type: string
      deploy-docs:
        required: true
        type: string
      deploy-links:
        required: true
        type: string
      deploy-storybook:
        required: true
        type: string
      deploy-www:
        required: true
        type: string
      result-app:
        required: true
        type: string
      result-studio:
        required: true
        type: string
      result-admin:
        required: true
        type: string
      result-docs:
        required: true
        type: string
      result-links:
        required: true
        type: string
      result-storybook:
        required: true
        type: string
      result-www:
        required: true
        type: string
    outputs:
      release-url:
        value: ${{ jobs.release.outputs.release-url }}
      changelog:
        value: ${{ jobs.release.outputs.changelog }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-url: ${{ steps.create-release.outputs.url }}
      changelog: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine previous tag
        id: prev
        run: |
          TAG_PREFIX="deploy-${{ inputs.environment }}-"
          PREV_TAG=$(git tag -l "${TAG_PREFIX}*" --sort=-creatordate | head -1)
          if [ -n "$PREV_TAG" ]; then
            echo "Found previous tag: $PREV_TAG"
            echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT
          else
            echo "No previous tag found — this is the first consolidated release"
            echo "tag=" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="deploy-${{ inputs.environment }}-${{ inputs.timestamp }}-${SHORT_SHA}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          git tag "$TAG"
          git push origin "$TAG"

      - name: Build apps deployed section
        id: apps
        env:
          ENV: ${{ inputs.environment }}
          DEPLOY_APP: ${{ inputs.deploy-app }}
          DEPLOY_STUDIO: ${{ inputs.deploy-studio }}
          DEPLOY_ADMIN: ${{ inputs.deploy-admin }}
          DEPLOY_DOCS: ${{ inputs.deploy-docs }}
          DEPLOY_LINKS: ${{ inputs.deploy-links }}
          DEPLOY_STORYBOOK: ${{ inputs.deploy-storybook }}
          DEPLOY_WWW: ${{ inputs.deploy-www }}
          RESULT_APP: ${{ inputs.result-app }}
          RESULT_STUDIO: ${{ inputs.result-studio }}
          RESULT_ADMIN: ${{ inputs.result-admin }}
          RESULT_DOCS: ${{ inputs.result-docs }}
          RESULT_LINKS: ${{ inputs.result-links }}
          RESULT_STORYBOOK: ${{ inputs.result-storybook }}
          RESULT_WWW: ${{ inputs.result-www }}
        run: |
          url_for() {
            case "$1" in
              app-prod)       echo "https://app.valguide.com" ;;
              app-dev)        echo "https://app.valguide.dev" ;;
              studio-prod)    echo "https://studio.valguide.com" ;;
              studio-dev)     echo "https://studio.valguide.dev" ;;
              admin-prod)     echo "https://ops.val.guide" ;;
              admin-dev)      echo "https://ops-dev.val.guide" ;;
              docs-prod)      echo "https://docs.val.guide" ;;
              docs-dev)       echo "https://docs-dev.val.guide" ;;
              links-prod)     echo "https://links.valguide.com" ;;
              links-dev)      echo "https://links.valguide.dev" ;;
              storybook-prod) echo "https://sb.val.guide" ;;
              storybook-dev)  echo "https://sb-dev.val.guide" ;;
              www-prod)       echo "https://www.valguide.com" ;;
              www-dev)        echo "https://www.valguide.dev" ;;
            esac
          }

          display_for() {
            case "$1" in
              app) echo "App" ;;
              studio) echo "Studio" ;;
              admin) echo "Admin" ;;
              docs) echo "Docs" ;;
              links) echo "Links" ;;
              storybook) echo "Storybook" ;;
              www) echo "www" ;;
            esac
          }

          SECTION=""
          add_app() {
            local should=$1 result=$2 name=$3
            if [ "$should" != "true" ]; then return; fi
            local url display
            url=$(url_for "${name}-${ENV}")
            display=$(display_for "$name")
            if [ "$result" = "success" ]; then
              SECTION="${SECTION}✅  **${display}** — ${url}\n"
            else
              SECTION="${SECTION}❌  **${display}** — ${url}\n"
            fi
          }

          add_app "$DEPLOY_APP"       "$RESULT_APP"       "app"
          add_app "$DEPLOY_STUDIO"    "$RESULT_STUDIO"    "studio"
          add_app "$DEPLOY_ADMIN"     "$RESULT_ADMIN"     "admin"
          add_app "$DEPLOY_DOCS"      "$RESULT_DOCS"      "docs"
          add_app "$DEPLOY_LINKS"     "$RESULT_LINKS"     "links"
          add_app "$DEPLOY_STORYBOOK" "$RESULT_STORYBOOK" "storybook"
          add_app "$DEPLOY_WWW"       "$RESULT_WWW"       "www"

          {
            echo "body<<EOF"
            echo -e "$SECTION"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          if [ -n "${{ steps.prev.outputs.tag }}" ]; then
            RANGE="${{ steps.prev.outputs.tag }}..HEAD"
          else
            RANGE="HEAD"
          fi

          format_commits() {
            local pattern=$1
            git log --pretty=format:"%s ([%h](${{ github.server_url }}/${{ github.repository }}/commit/%H))" $RANGE \
              | grep -E "$pattern" | sed 's/^/- /' || true
          }

          BREAKING=$(format_commits "^.+(\(.+\))?!:")
          FEATURES=$(format_commits "^feat(\(.+\))?[!]?:")
          FIXES=$(format_commits "^fix(\(.+\))?[!]?:")
          PERF=$(format_commits "^perf(\(.+\))?[!]?:")
          REFACTOR=$(format_commits "^refactor(\(.+\))?[!]?:")
          DOCS=$(format_commits "^docs(\(.+\))?[!]?:")
          TESTS=$(format_commits "^test(\(.+\))?[!]?:")
          CHORES=$(format_commits "^chore(\(.+\))?[!]?:")
          BUILD=$(format_commits "^build(\(.+\))?[!]?:")
          CI=$(format_commits "^ci(\(.+\))?[!]?:")
          STYLE=$(format_commits "^style(\(.+\))?[!]?:")
          REVERT=$(format_commits "^revert(\(.+\))?[!]?:")
          PLAN=$(format_commits "^plan(\(.+\))?[!]?:")
          BODY=""
          [ -n "$BREAKING" ] && BODY="${BODY}### 💥 Breaking Changes\n${BREAKING}\n\n"
          [ -n "$FEATURES" ] && BODY="${BODY}### ✨ Features\n${FEATURES}\n\n"
          [ -n "$FIXES" ]    && BODY="${BODY}### 🐛 Fixes\n${FIXES}\n\n"
          [ -n "$PERF" ]     && BODY="${BODY}### ⚡ Performance\n${PERF}\n\n"
          [ -n "$REFACTOR" ] && BODY="${BODY}### ♻️ Refactors\n${REFACTOR}\n\n"
          [ -n "$DOCS" ]     && BODY="${BODY}### 📖 Docs\n${DOCS}\n\n"
          [ -n "$TESTS" ]    && BODY="${BODY}### 🧪 Tests\n${TESTS}\n\n"
          [ -n "$CHORES" ]   && BODY="${BODY}### 🔧 Chores\n${CHORES}\n\n"
          [ -n "$BUILD" ]    && BODY="${BODY}### 🏗️ Build\n${BUILD}\n\n"
          [ -n "$CI" ]       && BODY="${BODY}### 👷 CI\n${CI}\n\n"
          [ -n "$STYLE" ]    && BODY="${BODY}### 🎨 Style\n${STYLE}\n\n"
          [ -n "$REVERT" ]   && BODY="${BODY}### ⏪ Reverts\n${REVERT}\n\n"
          [ -n "$PLAN" ]     && BODY="${BODY}### 📋 Plan\n${PLAN}\n\n"

          # Group remaining commits by unknown prefix or collect as uncategorized
          KNOWN="feat|fix|chore|docs|style|refactor|test|perf|ci|build|revert|plan"
          OTHER_LINES=$(git log --pretty=format:"%s ([%h](${{ github.server_url }}/${{ github.repository }}/commit/%H))" $RANGE \
            | grep -Ev "^($KNOWN)(\(.+\))?[!]?:" \
            | grep -Ev "^\[build [^\]]+\] \(" || true)

          if [ -n "$OTHER_LINES" ]; then
            UNKNOWN_PREFIXES=$(echo "$OTHER_LINES" | grep -oE "^[a-z]+(\(.+\))?[!]?:" | sed 's/(.*//' | sed 's/!.*//' | sort -u || true)

            for prefix in $UNKNOWN_PREFIXES; do
              HEADING=$(echo "$prefix" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
              MATCHES=$(echo "$OTHER_LINES" | grep -E "^${prefix}(\(.+\))?[!]?:" | sed 's/^/- /' || true)
              [ -n "$MATCHES" ] && BODY="${BODY}### ${HEADING}\n${MATCHES}\n\n"
              OTHER_LINES=$(echo "$OTHER_LINES" | grep -Ev "^${prefix}(\(.+\))?[!]?:" || true)
            done

            if [ -n "$OTHER_LINES" ]; then
              UNCATEGORIZED=$(echo "$OTHER_LINES" | sed 's/^/- /')
              BODY="${BODY}### 📝 Other\n${UNCATEGORIZED}\n\n"
            fi
          fi

          {
            echo "body<<EOF"
            echo -e "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Deploy → ${{ inputs.environment }} (${{ inputs.timestamp }})"
          body: |
            ## Deploy to ${{ inputs.environment }}

            👤 **Triggered by**: ${{ github.actor }}
            📦 **Commit**: [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            ${{ steps.prev.outputs.tag && format('📋 **Changes since**: [`{0}`]({1}/{2}/releases/tag/{0})', steps.prev.outputs.tag, github.server_url, github.repository) || '🎉 **First consolidated release for this environment!**' }}
            ${{ steps.prev.outputs.tag && format('🔀 **Full diff**: [{0}...{1}]({2}/{3}/compare/{0}...{4})', steps.prev.outputs.tag, steps.tag.outputs.tag, github.server_url, github.repository, steps.tag.outputs.tag) || '' }}

            ### Apps deployed
            ${{ steps.apps.outputs.body }}
            ---

            ${{ steps.changelog.outputs.body }}
          prerelease: ${{ inputs.environment == 'dev' }}
          make_latest: ${{ inputs.environment == 'prod' }}
