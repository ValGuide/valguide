# Reusable workflow: create ONE consolidated GitHub Release per deploy.
#
# Creates a single git tag (deploy-{env}-{TS}-{sha}) and a GitHub Release
# with a conventional-commits changelog showing commits since the last
# consolidated deploy of the same environment.
#
# Called by deploy.yml after all deploy jobs complete.

name: Release

on:
  workflow_call:
    inputs:
      manifest:
        required: true
        type: string
    outputs:
      release-url:
        value: ${{ jobs.release.outputs.release-url }}
      changelog:
        value: ${{ jobs.release.outputs.changelog }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-url: ${{ steps.create-release.outputs.url }}
      changelog: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine previous tag
        id: prev
        env:
          DEPLOY_ENVIRONMENT: ${{ fromJson(inputs.manifest).environment }}
        run: bash .github/scripts/release-find-previous-tag.sh

      - name: Create tag
        id: tag
        env:
          DEPLOY_ENVIRONMENT: ${{ fromJson(inputs.manifest).environment }}
          DEPLOY_TIMESTAMP: ${{ fromJson(inputs.manifest).timestamp }}
        run: bash .github/scripts/release-create-tag.sh

      - name: Build apps deployed section
        id: apps
        env:
          DEPLOY_MANIFEST: ${{ inputs.manifest }}
        run: bash .github/scripts/release-build-apps-section.sh

      - name: Generate changelog
        id: changelog
        env:
          PREVIOUS_TAG: ${{ steps.prev.outputs.tag }}
        run: bash .github/scripts/release-generate-changelog.sh

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "🚀 Deploy → ${{ fromJson(inputs.manifest).environment }} (${{ fromJson(inputs.manifest).timestamp }})"
          body: |
            ## 📦 Deployment Summary
            - **Environment:** ${{ fromJson(inputs.manifest).environment }}
            - **Triggered by:** @${{ fromJson(inputs.manifest).actor }}
            - **Commit:** [`${{ fromJson(inputs.manifest).sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ fromJson(inputs.manifest).sha }})
            ${{ steps.prev.outputs.tag && format('- **Previous release:** [`{0}`]({1}/{2}/releases/tag/{0})', steps.prev.outputs.tag, github.server_url, github.repository) || '- 🎉 **First consolidated release for this environment!**' }}
            ${{ steps.prev.outputs.tag && format('- **Full diff:** [{0} → {1}]({2}/{3}/compare/{0}...{4})', steps.prev.outputs.tag, steps.tag.outputs.tag, github.server_url, github.repository, steps.tag.outputs.tag) || '' }}

            ## 📦 Applications
            ${{ steps.apps.outputs.body }}

            ## 🛠 Changes
            ${{ steps.changelog.outputs.body }}
          prerelease: ${{ fromJson(inputs.manifest).environment == 'dev' }}
          make_latest: ${{ fromJson(inputs.manifest).environment == 'prod' }}
