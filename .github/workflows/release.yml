name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version, with or without a leading v.
        required: true
        type: string
      target_ref:
        description: Branch, tag, or SHA to release.
        required: true
        default: main
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease.
        required: true
        default: false
        type: boolean
      draft:
        description: Create the GitHub Release as a draft.
        required: true
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Validate release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/release-validate-version.sh

      - name: Resolve target SHA
        id: target
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing $sha from ${{ inputs.target_ref }}"

      - name: Check release tag does not exist
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release tag already exists: $RELEASE_TAG"
            exit 1
          fi

      - name: Verify public CI passed
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          REQUIRED_WORKFLOW: CI
        run: bash .github/scripts/release-verify-ci.sh

      - name: Determine previous tag
        id: prev
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: bash .github/scripts/release-find-previous-tag.sh

      - name: Generate changelog
        id: changelog
        env:
          PREVIOUS_TAG: ${{ steps.prev.outputs.tag }}
        run: bash .github/scripts/release-generate-changelog.sh

      - name: Write release notes
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.prev.outputs.tag }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          CHANGELOG_BODY: ${{ steps.changelog.outputs.body }}
        run: |
          set -euo pipefail

          {
            printf '## Release %s\n\n' "$RELEASE_TAG"
            printf -- '- **Target SHA:** [`%s`](%s/%s/commit/%s)\n' "$TARGET_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TARGET_SHA"
            if [ -n "$PREVIOUS_TAG" ]; then
              printf -- '- **Previous release:** [`%s`](%s/%s/releases/tag/%s)\n' "$PREVIOUS_TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PREVIOUS_TAG"
              printf -- '- **Full diff:** [%s...%s](%s/%s/compare/%s...%s)\n' "$PREVIOUS_TAG" "$RELEASE_TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$RELEASE_TAG"
            else
              printf -- '- **Previous release:** none\n'
            fi
            printf '\n## Changes\n\n'
            if [ -n "$CHANGELOG_BODY" ]; then
              printf '%s\n' "$CHANGELOG_BODY"
            else
              printf 'No commit changes found for this release.\n'
            fi
          } > release-notes.md

      - name: Create tag
        id: tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: bash .github/scripts/release-create-tag.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: ${{ steps.version.outputs.tag }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          args=(release create "$RELEASE_TAG" --title "$RELEASE_NAME" --notes-file release-notes.md)
          if [ "$IS_DRAFT" = "true" ]; then
            args+=(--draft)
          fi
          if [ "$IS_PRERELEASE" = "true" ]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi

          gh "${args[@]}"
