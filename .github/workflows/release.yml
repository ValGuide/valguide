# Reusable workflow: create ONE consolidated GitHub Release per deploy.
#
# Creates a single git tag (deploy-{env}-{TS}-{sha}) and a GitHub Release
# with a conventional-commits changelog showing commits since the last
# consolidated deploy of the same environment.
#
# Called by deploy.yml after all deploy jobs complete.

name: Release

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      timestamp:
        required: true
        type: string
      deploy-app:
        required: true
        type: string
      deploy-studio:
        required: true
        type: string
      deploy-admin:
        required: true
        type: string
      deploy-docs:
        required: true
        type: string
      deploy-links:
        required: true
        type: string
      deploy-storybook:
        required: true
        type: string
      deploy-www:
        required: true
        type: string
      deploy-workers:
        required: true
        type: string
      result-app:
        required: true
        type: string
      result-studio:
        required: true
        type: string
      result-admin:
        required: true
        type: string
      result-docs:
        required: true
        type: string
      result-links:
        required: true
        type: string
      result-storybook:
        required: true
        type: string
      result-www:
        required: true
        type: string
      result-workers:
        required: true
        type: string
    outputs:
      release-url:
        value: ${{ jobs.release.outputs.release-url }}
      changelog:
        value: ${{ jobs.release.outputs.changelog }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-url: ${{ steps.create-release.outputs.url }}
      changelog: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine previous tag
        id: prev
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: bash .github/scripts/release-find-previous-tag.sh

      - name: Create tag
        id: tag
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_TIMESTAMP: ${{ inputs.timestamp }}
        run: bash .github/scripts/release-create-tag.sh

      - name: Build apps deployed section
        id: apps
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_APP: ${{ inputs.deploy-app }}
          DEPLOY_STUDIO: ${{ inputs.deploy-studio }}
          DEPLOY_ADMIN: ${{ inputs.deploy-admin }}
          DEPLOY_DOCS: ${{ inputs.deploy-docs }}
          DEPLOY_LINKS: ${{ inputs.deploy-links }}
          DEPLOY_STORYBOOK: ${{ inputs.deploy-storybook }}
          DEPLOY_WWW: ${{ inputs.deploy-www }}
          DEPLOY_WORKERS: ${{ inputs.deploy-workers }}
          RESULT_APP: ${{ inputs.result-app }}
          RESULT_STUDIO: ${{ inputs.result-studio }}
          RESULT_ADMIN: ${{ inputs.result-admin }}
          RESULT_DOCS: ${{ inputs.result-docs }}
          RESULT_LINKS: ${{ inputs.result-links }}
          RESULT_STORYBOOK: ${{ inputs.result-storybook }}
          RESULT_WWW: ${{ inputs.result-www }}
          RESULT_WORKERS: ${{ inputs.result-workers }}
        run: bash .github/scripts/release-build-apps-section.sh

      - name: Generate changelog
        id: changelog
        env:
          PREVIOUS_TAG: ${{ steps.prev.outputs.tag }}
        run: bash .github/scripts/release-generate-changelog.sh

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "🚀 Deploy → ${{ inputs.environment }} (${{ inputs.timestamp }})"
          body: |
            ## 📦 Deployment Summary
            - **Environment:** ${{ inputs.environment }}
            - **Triggered by:** @${{ github.actor }}
            - **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            ${{ steps.prev.outputs.tag && format('- **Previous release:** [`{0}`]({1}/{2}/releases/tag/{0})', steps.prev.outputs.tag, github.server_url, github.repository) || '- 🎉 **First consolidated release for this environment!**' }}
            ${{ steps.prev.outputs.tag && format('- **Full diff:** [{0} → {1}]({2}/{3}/compare/{0}...{4})', steps.prev.outputs.tag, steps.tag.outputs.tag, github.server_url, github.repository, steps.tag.outputs.tag) || '' }}

            ## 📦 Applications
            ${{ steps.apps.outputs.body }}

            ## 🛠 Changes
            ${{ steps.changelog.outputs.body }}
          prerelease: ${{ inputs.environment == 'dev' }}
          make_latest: ${{ inputs.environment == 'prod' }}
