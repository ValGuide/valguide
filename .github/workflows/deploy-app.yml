# Deploy App to Cloudflare Workers
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers deploy permissions
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#
# Runtime secrets (DATABASE_URL, SUPABASE_SECRET_KEY) are pushed
# separately via `wrangler secret put` — NOT managed by CI.
#
# Triggered by commit message tags:
#   [build app]           — deploy app
#   [build app,studio]    — deploy app (and studio in its own workflow)
#   [build all]           — deploy all apps

name: Deploy App

on:
  push:
    branches: [main, dev]

concurrency:
  group: deploy-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.valguide.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_POSTHOG_ENABLED: "true"
      VITE_POSTHOG_KEY: <public-posthog-project-key>
      VITE_POSTHOG_HOST: https://e.valguide.com
      VITE_STUDIO_URL: https://studio.valguide.com
      VITE_APP_DOMAIN: app.valguide.com
      VITE_ENV: prod
    steps:
      - uses: actions/checkout@v4

      - name: Check if app should deploy
        id: check
        run: node scripts/should-deploy.mjs app
        continue-on-error: true

      - uses: pnpm/action-setup@v4
        if: steps.check.outcome == 'success'

      - uses: actions/setup-node@v4
        if: steps.check.outcome == 'success'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.check.outcome == 'success'

      - name: Build & Deploy
        if: steps.check.outcome == 'success'
        run: pnpm --filter @valguide/app run deploy

  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://app.valguide.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_POSTHOG_ENABLED: "true"
      VITE_POSTHOG_KEY: <public-posthog-project-key>
      VITE_POSTHOG_HOST: https://e.valguide.dev
      VITE_STUDIO_URL: https://studio.valguide.dev
      VITE_APP_DOMAIN: app.valguide.dev
      VITE_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - name: Check if app should deploy
        id: check
        run: node scripts/should-deploy.mjs app
        continue-on-error: true

      - uses: pnpm/action-setup@v4
        if: steps.check.outcome == 'success'

      - uses: actions/setup-node@v4
        if: steps.check.outcome == 'success'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.check.outcome == 'success'

      - name: Build & Deploy
        if: steps.check.outcome == 'success'
        run: pnpm --filter @valguide/app run deploy:dev
