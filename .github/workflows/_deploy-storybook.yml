name: Deploy Storybook (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    outputs:
      url:
        value: ${{ jobs.deploy-prod.outputs.url || jobs.deploy-dev.outputs.url }}
      environment-name:
        value: ${{ jobs.deploy-prod.outputs.environment-name || jobs.deploy-dev.outputs.environment-name }}

jobs:
  deploy-prod:
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.info.outputs.url }}
      environment-name: ${{ steps.info.outputs.environment-name }}
    environment:
      name: storybook-prod
      url: https://sb.val.guide
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build & Deploy
        run: pnpm --filter @valguide/storybook run deploy
      - id: info
        run: |
          echo "url=https://sb.val.guide" >> $GITHUB_OUTPUT
          echo "environment-name=storybook-prod" >> $GITHUB_OUTPUT

  deploy-dev:
    if: inputs.environment == 'dev'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.info.outputs.url }}
      environment-name: ${{ steps.info.outputs.environment-name }}
    environment:
      name: storybook-dev
      url: https://sb-dev.val.guide
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build & Deploy
        run: pnpm --filter @valguide/storybook run deploy:dev
      - id: info
        run: |
          echo "url=https://sb-dev.val.guide" >> $GITHUB_OUTPUT
          echo "environment-name=storybook-dev" >> $GITHUB_OUTPUT
