name: Deploy Studio (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    outputs:
      url:
        value: ${{ jobs.deploy-prod.outputs.url || jobs.deploy-dev.outputs.url }}
      environment-name:
        value: ${{ jobs.deploy-prod.outputs.environment-name || jobs.deploy-dev.outputs.environment-name }}

jobs:
  deploy-prod:
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.info.outputs.url }}
      environment-name: ${{ steps.info.outputs.environment-name }}
    environment:
      name: studio-prod
      url: https://studio.valguide.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_POSTHOG_ENABLED: "true"
      VITE_POSTHOG_KEY: <public-posthog-project-key>
      VITE_POSTHOG_HOST: https://e.valguide.com
      VITE_STUDIO_URL: https://studio.valguide.com
      VITE_APP_DOMAIN: app.valguide.com
      VITE_R2_PUBLIC_URL: https://assets.valguide.com
      VITE_ENV: prod
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build & Deploy
        run: pnpm --filter @valguide/studio run deploy
      - id: info
        run: |
          echo "url=https://studio.valguide.com" >> $GITHUB_OUTPUT
          echo "environment-name=studio-prod" >> $GITHUB_OUTPUT

  deploy-dev:
    if: inputs.environment == 'dev'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.info.outputs.url }}
      environment-name: ${{ steps.info.outputs.environment-name }}
    environment:
      name: studio-dev
      url: https://studio.valguide.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_POSTHOG_ENABLED: "true"
      VITE_POSTHOG_KEY: <public-posthog-project-key>
      VITE_POSTHOG_HOST: https://e.valguide.dev
      VITE_STUDIO_URL: https://studio.valguide.dev
      VITE_APP_DOMAIN: app.valguide.dev
      VITE_R2_PUBLIC_URL: https://assets.valguide.dev
      VITE_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build & Deploy
        run: pnpm --filter @valguide/studio run deploy:dev
      - id: info
        run: |
          echo "url=https://studio.valguide.dev" >> $GITHUB_OUTPUT
          echo "environment-name=studio-dev" >> $GITHUB_OUTPUT
