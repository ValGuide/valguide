# Deploy WWW to Cloudflare Workers
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers deploy permissions
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#
# Runtime secrets (DATABASE_URL, SUPABASE_SECRET_KEY) are pushed
# separately via `pnpm env:push:cf www dev|prod` — NOT managed by CI.
#
# Triggered by commit message tags:
#   [build www]            — deploy www
#   [build www,admin]      — deploy www (and admin in its own workflow)
#   [build all]            — deploy all apps

name: Deploy www

on:
  push:
    branches: [main, dev]

concurrency:
  group: deploy-www-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.valguide.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_POSTHOG_ENABLED: "true"
      VITE_POSTHOG_KEY: <public-posthog-project-key>
      VITE_POSTHOG_HOST: https://e.valguide.com
      VITE_APP_DOMAIN: app.valguide.com
      VITE_ENV: prod
    steps:
      - uses: actions/checkout@v4

      - name: Check if www should deploy
        id: check
        run: node scripts/should-deploy.mjs www
        continue-on-error: true

      - uses: pnpm/action-setup@v4
        if: steps.check.outcome == 'success'

      - uses: actions/setup-node@v4
        if: steps.check.outcome == 'success'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.check.outcome == 'success'

      - name: Build & Deploy
        if: steps.check.outcome == 'success'
        run: pnpm --filter @valguide/www run deploy

  notify-prod:
    needs: deploy-prod
    if: always() && needs.deploy-prod.result != 'skipped'
    uses: ./.github/workflows/notify-slack.yml
    with:
      app-name: WWW
      environment: production
      url: https://www.valguide.com
      status: ${{ needs.deploy-prod.result }}
    secrets:
      VALBOT_SLACK_TOKEN: ${{ secrets.VALBOT_SLACK_TOKEN }}

  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://www.valguide.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_POSTHOG_ENABLED: "true"
      VITE_POSTHOG_KEY: <public-posthog-project-key>
      VITE_POSTHOG_HOST: https://e.valguide.dev
      VITE_APP_DOMAIN: app.valguide.dev
      VITE_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - name: Check if www should deploy
        id: check
        run: node scripts/should-deploy.mjs www
        continue-on-error: true

      - uses: pnpm/action-setup@v4
        if: steps.check.outcome == 'success'

      - uses: actions/setup-node@v4
        if: steps.check.outcome == 'success'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.check.outcome == 'success'

      - name: Build & Deploy
        if: steps.check.outcome == 'success'
        run: pnpm --filter @valguide/www run deploy:dev

  notify-dev:
    needs: deploy-dev
    if: always() && needs.deploy-dev.result != 'skipped'
    uses: ./.github/workflows/notify-slack.yml
    with:
      app-name: WWW
      environment: development
      url: https://www.valguide.dev
      status: ${{ needs.deploy-dev.result }}
    secrets:
      VALBOT_SLACK_TOKEN: ${{ secrets.VALBOT_SLACK_TOKEN }}
