# Deploy Storybook to Cloudflare Workers (static site with password protection)
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers deploy permissions
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#
# Runtime secrets (STORYBOOK_PASSWORD) are pushed separately via
# `wrangler secret put STORYBOOK_PASSWORD` — NOT managed by CI.
#
# Triggered by commit message tags:
#   [build storybook]     — deploy storybook
#   [build all]           — deploy all apps

name: Deploy Storybook

on:
  push:
    branches: [main, dev]

concurrency:
  group: deploy-storybook-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/check-deploy.yml
    with:
      app-name: storybook

  deploy-prod:
    needs: check
    if: needs.check.outputs.should_deploy == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: storybook-prod
      url: https://sb.val.guide
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build & Deploy
        run: pnpm --filter @valguide/storybook run deploy

  notify-prod:
    needs: [check, deploy-prod]
    if: always() && needs.check.outputs.should_deploy == 'true' && needs.deploy-prod.result != 'skipped'
    uses: ./.github/workflows/notify-slack.yml
    with:
      app-name: Storybook
      environment: prod
      url: https://sb.val.guide
      status: ${{ needs.deploy-prod.result }}
    secrets:
      VALBOT_SLACK_TOKEN: ${{ secrets.VALBOT_SLACK_TOKEN }}

  deploy-dev:
    needs: check
    if: needs.check.outputs.should_deploy == 'true' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: storybook-dev
      url: https://sb-dev.val.guide
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build & Deploy
        run: pnpm --filter @valguide/storybook run deploy:dev

  notify-dev:
    needs: [check, deploy-dev]
    if: always() && needs.check.outputs.should_deploy == 'true' && needs.deploy-dev.result != 'skipped'
    uses: ./.github/workflows/notify-slack.yml
    with:
      app-name: Storybook
      environment: dev
      url: https://sb-dev.val.guide
      status: ${{ needs.deploy-dev.result }}
    secrets:
      VALBOT_SLACK_TOKEN: ${{ secrets.VALBOT_SLACK_TOKEN }}

  release-prod:
    needs: [check, deploy-prod]
    if: needs.deploy-prod.result == 'success'
    uses: ./.github/workflows/create-release.yml
    with:
      app-name: storybook
      app-display-name: Storybook
      environment: prod
      url: https://sb.val.guide

  release-dev:
    needs: [check, deploy-dev]
    if: needs.deploy-dev.result == 'success'
    uses: ./.github/workflows/create-release.yml
    with:
      app-name: storybook
      app-display-name: Storybook
      environment: dev
      url: https://sb-dev.val.guide
