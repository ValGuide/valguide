# Deploy Storybook to Cloudflare Workers (static site with password protection)
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers deploy permissions
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#
# Runtime secrets (STORYBOOK_PASSWORD) are pushed separately via
# `wrangler secret put STORYBOOK_PASSWORD` — NOT managed by CI.
#
# Triggered by commit message tags:
#   [build storybook]     — deploy storybook
#   [build all]           — deploy all apps

name: Deploy Storybook

on:
  push:
    branches: [main]

concurrency:
  group: deploy-storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sb.val.guide
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if storybook should deploy
        id: check
        run: node scripts/should-deploy.mjs storybook
        continue-on-error: true

      - uses: pnpm/action-setup@v4
        if: steps.check.outcome == 'success'

      - uses: actions/setup-node@v4
        if: steps.check.outcome == 'success'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.check.outcome == 'success'

      - name: Build & Deploy
        if: steps.check.outcome == 'success'
        run: pnpm --filter @valguide/storybook run deploy
