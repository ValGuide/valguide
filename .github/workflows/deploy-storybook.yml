# Deploy Storybook to Cloudflare Workers (static site with password protection)
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers deploy permissions
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#
# Runtime secrets (STORYBOOK_PASSWORD) are pushed separately via
# `wrangler secret put STORYBOOK_PASSWORD` — NOT managed by CI.
#
# Triggered by commit message tags:
#   [build storybook]     — deploy storybook
#   [build all]           — deploy all apps

name: Deploy Storybook

on:
  push:
    branches: [main]

concurrency:
  group: deploy-storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check-deploy.yml
    with:
      app-name: storybook

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sb.val.guide
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build & Deploy
        run: pnpm --filter @valguide/storybook run deploy

  notify:
    needs: [check, deploy]
    if: always() && needs.check.outputs.should_deploy == 'true' && needs.deploy.result != 'skipped'
    uses: ./.github/workflows/notify-slack.yml
    with:
      app-name: Storybook
      environment: production
      url: https://sb.val.guide
      status: ${{ needs.deploy.result }}
    secrets:
      VALBOT_SLACK_TOKEN: ${{ secrets.VALBOT_SLACK_TOKEN }}
