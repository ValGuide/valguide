# Deploy Studio to Cloudflare Workers
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers deploy permissions
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#
# Runtime secrets (DATABASE_URL, SUPABASE_SECRET_KEY, etc.) are pushed
# separately via `pnpm studio:env:push dev|prod` — NOT managed by CI.
#
# Triggered by commit message tags:
#   [build studio]        — deploy studio
#   [build studio,admin]  — deploy studio (and admin in its own workflow)
#   [build all]           — deploy all apps

name: Deploy Studio

on:
  push:
    branches: [main, dev]

concurrency:
  group: deploy-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          APP_NAME: studio
        run: |
          echo "Commit message: $COMMIT_MSG"
          echo "App: $APP_NAME"

          if echo "$COMMIT_MSG" | grep -qF '[build all]'; then
            echo "✅ [build all] found — deploying $APP_NAME"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          SCOPES=$(echo "$COMMIT_MSG" | grep -oE '\[build [^]]+' | sed 's/\[build //' | tr ' ,' '\n' | tr -s '\n')

          if [ -n "$SCOPES" ]; then
            echo "Found scoped build request: $(echo $SCOPES | tr '\n' ' ')"
            if echo "$SCOPES" | grep -qx "$APP_NAME"; then
              echo "✅ '$APP_NAME' matches scope — deploying"
              echo "should_deploy=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "🚫 '$APP_NAME' not in scope — skipping"
          else
            echo "🚫 No [build] tag found — skipping deploy"
          fi

          echo "should_deploy=false" >> $GITHUB_OUTPUT

  deploy-prod:
    needs: check
    if: needs.check.outputs.should_deploy == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://studio.valguide.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_POSTHOG_ENABLED: "true"
      VITE_POSTHOG_KEY: <public-posthog-project-key>
      VITE_POSTHOG_HOST: https://e.valguide.com
      VITE_STUDIO_URL: https://studio.valguide.com
      VITE_APP_DOMAIN: app.valguide.com
      VITE_ENV: prod
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build & Deploy
        run: pnpm --filter @valguide/studio run deploy

  notify-prod:
    needs: [check, deploy-prod]
    if: always() && needs.check.outputs.should_deploy == 'true' && needs.deploy-prod.result != 'skipped'
    uses: ./.github/workflows/notify-slack.yml
    with:
      app-name: Studio
      environment: production
      url: https://studio.valguide.com
      status: ${{ needs.deploy-prod.result }}
    secrets:
      VALBOT_SLACK_TOKEN: ${{ secrets.VALBOT_SLACK_TOKEN }}

  deploy-dev:
    needs: check
    if: needs.check.outputs.should_deploy == 'true' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://studio.valguide.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_POSTHOG_ENABLED: "true"
      VITE_POSTHOG_KEY: <public-posthog-project-key>
      VITE_POSTHOG_HOST: https://e.valguide.dev
      VITE_STUDIO_URL: https://studio.valguide.dev
      VITE_APP_DOMAIN: app.valguide.dev
      VITE_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build & Deploy
        run: pnpm --filter @valguide/studio run deploy:dev

  notify-dev:
    needs: [check, deploy-dev]
    if: always() && needs.check.outputs.should_deploy == 'true' && needs.deploy-dev.result != 'skipped'
    uses: ./.github/workflows/notify-slack.yml
    with:
      app-name: Studio
      environment: development
      url: https://studio.valguide.dev
      status: ${{ needs.deploy-dev.result }}
    secrets:
      VALBOT_SLACK_TOKEN: ${{ secrets.VALBOT_SLACK_TOKEN }}
