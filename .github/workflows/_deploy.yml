# Reusable workflow: build and deploy a single deploy target to Cloudflare Workers.
#
# Handles environment-specific configuration (URLs, env vars, PostHog)
# internally based on app-name + environment, then uploads a JSON result
# artifact consumed by the release and notification jobs.

name: _deploy

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
        description: "Lowercase target name (app, studio, admin, docs, links, storybook, www, workers)"
      environment:
        required: true
        type: string
        description: "Environment (dev or prod)"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: ${{ inputs.app-name }}-${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
      APP_WORKER_NAME: ${{ vars.APP_WORKER_NAME }}
      APP_ROUTES: ${{ vars.APP_ROUTES }}
      STUDIO_WORKER_NAME: ${{ vars.STUDIO_WORKER_NAME }}
      STUDIO_ROUTES: ${{ vars.STUDIO_ROUTES }}
      ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
      ADMIN_ROUTES: ${{ vars.ADMIN_ROUTES }}
      LINKS_WORKER_NAME: ${{ vars.LINKS_WORKER_NAME }}
      LINKS_ROUTES: ${{ vars.LINKS_ROUTES }}
      WWW_WORKER_NAME: ${{ vars.WWW_WORKER_NAME }}
      WWW_ROUTES: ${{ vars.WWW_ROUTES }}
      DOCS_WORKER_NAME: ${{ vars.DOCS_WORKER_NAME }}
      DOCS_ROUTES: ${{ vars.DOCS_ROUTES }}
      STORYBOOK_WORKER_NAME: ${{ vars.STORYBOOK_WORKER_NAME }}
      STORYBOOK_ROUTES: ${{ vars.STORYBOOK_ROUTES }}
      IMAGE_GUARD_WORKER_NAME: ${{ vars.IMAGE_GUARD_WORKER_NAME }}
      IMAGE_GUARD_ROUTES: ${{ vars.IMAGE_GUARD_ROUTES }}
      POSTHOG_PROXY_WORKER_NAME: ${{ vars.POSTHOG_PROXY_WORKER_NAME }}
      POSTHOG_PROXY_ROUTES: ${{ vars.POSTHOG_PROXY_ROUTES }}
      CF_AUTH_KV_ID: ${{ vars.CF_AUTH_KV_ID }}
      CF_TOUR_DATA_KV_ID: ${{ vars.CF_TOUR_DATA_KV_ID }}
      CF_MAINTENANCE_KV_ID: ${{ vars.CF_MAINTENANCE_KV_ID }}
      CF_LINKS_KV_ID: ${{ vars.CF_LINKS_KV_ID }}
      CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME }}
      CF_R2_JURISDICTION: ${{ vars.CF_R2_JURISDICTION }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      LINKS_BASE_URL: ${{ vars.LINKS_BASE_URL }}
      ADMIN_BASE_URL: ${{ vars.ADMIN_BASE_URL }}
      ADMIN_COOKIE_DOMAIN: ${{ vars.ADMIN_COOKIE_DOMAIN }}
      VITE_STUDIO_URL: ${{ vars.VITE_STUDIO_URL }}
      VITE_APP_DOMAIN: ${{ vars.VITE_APP_DOMAIN }}
      VITE_PRIVACY_POLICY_URL: ${{ vars.VITE_PRIVACY_POLICY_URL }}
      VITE_TERMS_OF_SERVICE_URL: ${{ vars.VITE_TERMS_OF_SERVICE_URL }}
      VITE_R2_PUBLIC_URL: ${{ vars.VITE_R2_PUBLIC_URL }}
      VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
      BETTER_AUTH_TRUSTED_ORIGINS: ${{ vars.BETTER_AUTH_TRUSTED_ORIGINS }}
      BETTER_AUTH_COOKIE_DOMAIN: ${{ vars.BETTER_AUTH_COOKIE_DOMAIN }}
      BETTER_AUTH_COOKIE_PREFIX: ${{ vars.BETTER_AUTH_COOKIE_PREFIX }}
      MAINTENANCE_SLACK_CHANNEL: ${{ vars.MAINTENANCE_SLACK_CHANNEL }}
      USERS_SLACK_CHANNEL: ${{ vars.USERS_SLACK_CHANNEL }}
      STUDIO_EVENTS_SLACK_CHANNEL: ${{ vars.STUDIO_EVENTS_SLACK_CHANNEL }}
      STUDIO_FEEDBACK_SLACK_CHANNEL: ${{ vars.STUDIO_FEEDBACK_SLACK_CHANNEL }}
      STUDIO_PERFORMANCE_LOG_ENABLED: ${{ vars.STUDIO_PERFORMANCE_LOG_ENABLED }}
      LINEAR_FEEDBACK_TEAM_ID: ${{ vars.LINEAR_FEEDBACK_TEAM_ID }}
      LINEAR_FEEDBACK_LABEL_ID: ${{ vars.LINEAR_FEEDBACK_LABEL_ID }}
      BLOCK_ROBOTS: ${{ vars.BLOCK_ROBOTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Configure environment
        id: config
        if: inputs.app-name != 'workers' && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          APP_NAME: ${{ inputs.app-name }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: bash .github/scripts/configure-app-deploy.sh

      - name: Deploy app
        id: deploy-app
        if: inputs.app-name != 'workers' && steps.config.outcome == 'success'
        continue-on-error: true
        env:
          APP_NAME: ${{ inputs.app-name }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: bash .github/scripts/deploy-app.sh

      - name: Deploy workers
        id: deploy-workers
        if: inputs.app-name == 'workers' && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: bash .github/scripts/deploy-workers.sh

      - name: Record deploy result
        id: result
        if: always()
        env:
          APP_NAME: ${{ inputs.app-name }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          DEPLOY_APP_OUTCOME: ${{ steps.deploy-app.outcome }}
          DEPLOY_WORKERS_OUTCOME: ${{ steps.deploy-workers.outcome }}
        run: |
          set -euo pipefail

          source .github/scripts/deploy-targets.sh

          result="failure"
          if [ "${INSTALL_OUTCOME:-}" != "success" ]; then
            result="failure"
          elif [ "$APP_NAME" = "workers" ]; then
            if [ "${DEPLOY_WORKERS_OUTCOME:-}" = "success" ]; then
              result="success"
            fi
          elif [ "${CONFIG_OUTCOME:-}" = "success" ] && [ "${DEPLOY_APP_OUTCOME:-}" = "success" ]; then
            result="success"
          fi

          mkdir -p deploy-result
          jq -n \
            --arg name "$APP_NAME" \
            --arg display "$(deploy_display_for "$APP_NAME")" \
            --arg url "$(deploy_url_for "${APP_NAME}-${DEPLOY_ENVIRONMENT}")" \
            --arg result "$result" \
            '{ name: $name, display: $display, url: $url, result: $result }' \
            > "deploy-result/${APP_NAME}.json"

          echo "result=${result}" >> "$GITHUB_OUTPUT"

      - name: Upload deploy result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-result-${{ inputs.app-name }}
          path: deploy-result/${{ inputs.app-name }}.json
          if-no-files-found: error

      - name: Fail failed deploy target
        if: always() && steps.result.outputs.result == 'failure'
        run: exit 1
