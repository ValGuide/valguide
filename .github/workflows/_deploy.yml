# Reusable workflow: build and deploy a single app to Cloudflare Workers.
#
# Handles environment-specific configuration (URLs, env vars, PostHog)
# internally based on app-name + environment. Creates a per-app git tag
# on success via the create-app-tag composite action.

name: _deploy

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
        description: "Lowercase app name (app, studio, admin, docs, links, storybook, www)"
      environment:
        required: true
        type: string
        description: "Environment (dev or prod)"
      timestamp:
        required: true
        type: string
        description: "Deploy timestamp (shared across all jobs)"
    outputs:
      url:
        value: ${{ jobs.deploy.outputs.url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      url: ${{ steps.config.outputs.url }}
    environment:
      name: ${{ inputs.app-name }}-${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POSTHOG_PROJECT_KEY_DEV: ${{ vars.POSTHOG_PROJECT_KEY_DEV }}
      POSTHOG_PROJECT_KEY_PROD: ${{ vars.POSTHOG_PROJECT_KEY_PROD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configure environment
        id: config
        env:
          APP_NAME: ${{ inputs.app-name }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: bash .github/scripts/configure-app-deploy.sh

      - name: Build & Deploy
        env:
          APP_NAME: ${{ inputs.app-name }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: bash .github/scripts/deploy-app.sh

      - uses: ./.github/actions/create-app-tag
        with:
          app-name: ${{ inputs.app-name }}
          environment: ${{ inputs.environment }}
          timestamp: ${{ inputs.timestamp }}
