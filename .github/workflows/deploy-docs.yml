# Deploy Docs to Cloudflare Workers
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers deploy permissions
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#
# Runtime secrets (DOCS_PASSWORD) are pushed separately via
# `pnpm env:push:cf docs prod` — NOT managed by CI.
#
# Triggered by commit message tags:
#   [build docs]           — deploy docs
#   [build all]            — deploy all apps

name: Deploy Docs

on:
  push:
    branches: [main]

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check-deploy.yml
    with:
      app-name: docs

  cancel-if-skipped:
    needs: check
    if: needs.check.outputs.should_deploy == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cancel-if-skipped
        with:
          should_deploy: ${{ needs.check.outputs.should_deploy }}

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://docs.val.guide
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build & Deploy
        run: pnpm --filter @valguide/docs run deploy

  notify:
    needs: [check, deploy]
    if: always() && needs.check.outputs.should_deploy == 'true' && needs.deploy.result != 'skipped'
    uses: ./.github/workflows/notify-slack.yml
    with:
      app-name: Docs
      environment: prod
      url: https://docs.val.guide
      status: ${{ needs.deploy.result }}
    secrets:
      VALBOT_SLACK_TOKEN: ${{ secrets.VALBOT_SLACK_TOKEN }}
