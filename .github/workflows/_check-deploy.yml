# Reusable workflow: parse commit message [build ...] tags and determine
# which apps to deploy and the target environment.

name: _check-deploy

on:
  workflow_call:
    inputs:
      manual_environment:
        required: false
        type: string
        default: ''
      manual_scope:
        required: false
        type: string
        default: ''
    outputs:
      environment:
        value: ${{ jobs.check.outputs.environment }}
      targets-json:
        value: ${{ jobs.check.outputs.targets-json }}
      any-deploy:
        value: ${{ jobs.check.outputs.any-deploy }}
      timestamp:
        value: ${{ jobs.check.outputs.timestamp }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.check.outputs.environment }}
      targets-json: ${{ steps.check.outputs.targets-json }}
      any-deploy: ${{ steps.check.outputs.any-deploy }}
      timestamp: ${{ steps.ts.outputs.timestamp }}
    steps:
      - name: Generate deploy timestamp
        id: ts
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H%M%S)" >> $GITHUB_OUTPUT

      - name: Determine environment and apps to deploy
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          MANUAL_ENVIRONMENT: ${{ inputs.manual_environment }}
          MANUAL_SCOPE: ${{ inputs.manual_scope }}
        run: |
          set -euo pipefail

          APPS="app studio admin docs links storybook www workers"
          ANY=false
          APP_LIST=$(echo "$APPS" | tr ' ' '\n')

          write_targets_json() {
            local scopes="${1:-}"
            local json="["
            local separator=""

            for app in $APPS; do
              if printf '%s\n' "$scopes" | grep -qx "$app"; then
                json="${json}${separator}\"${app}\""
                separator=","
              fi
            done

            json="${json}]"
            echo "targets-json=${json}" >> "$GITHUB_OUTPUT"
          }

          set_outputs_from_scopes() {
            local scopes="${1:-}"
            local any=false

            for app in $APPS; do
              if printf '%s\n' "$scopes" | grep -qx "$app"; then
                any=true
              fi
            done

            ANY=$any
            write_targets_json "$scopes"
          }

          if [ -n "${MANUAL_ENVIRONMENT:-}" ]; then
            echo "environment=${MANUAL_ENVIRONMENT}" >> "$GITHUB_OUTPUT"

            raw_scope=$(printf '%s' "${MANUAL_SCOPE:-}" | tr '[:upper:]' '[:lower:]')
            normalized_scope=$(printf '%s' "$raw_scope" | sed -E 's/^\[build[[:space:]]+//; s/\][[:space:]]*$//')

            if [ -z "$normalized_scope" ]; then
              echo "::error::Manual deploy scope cannot be empty."
              exit 1
            fi

            if [ "$normalized_scope" = "all" ]; then
              echo "✅ Manual deploy requested for all apps"
              set_outputs_from_scopes "$(printf '%s\n' $APPS)"
            elif [ "$normalized_scope" = "apps" ]; then
              echo "✅ Manual deploy requested for all apps except workers"
              set_outputs_from_scopes "$(printf '%s\n' app studio admin docs links storybook www)"
            else
              scopes=$(printf '%s' "$normalized_scope" | tr ' ,' '\n' | tr -s '\n' | sed '/^$/d')
              unknown=$(printf '%s\n' "$scopes" | while read -r scope; do
                if [ -n "$scope" ] && ! echo "$APP_LIST" | grep -qx "$scope"; then
                  echo "$scope"
                fi
              done)

              if [ -n "$unknown" ]; then
                echo "::error::Unknown manual deploy scope(s): $(echo "$unknown" | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
                echo "::error::Allowed values: all, apps, or any of: $APPS"
                exit 1
              fi

              echo "✅ Manual deploy requested for: $(echo "$scopes" | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
              set_outputs_from_scopes "$scopes"
            fi
          else
            if [ "${GITHUB_REF:-}" = "refs/heads/main" ]; then
              echo "environment=prod" >> "$GITHUB_OUTPUT"
            else
              echo "environment=dev" >> "$GITHUB_OUTPUT"
            fi

            if echo "${COMMIT_MSG:-}" | grep -qF '[build all]'; then
              echo "✅ [build all] found — deploying everything"
              set_outputs_from_scopes "$(printf '%s\n' $APPS)"
            elif echo "${COMMIT_MSG:-}" | grep -qF '[build apps]'; then
              echo "✅ [build apps] found — deploying all apps except workers"
              set_outputs_from_scopes "$(printf '%s\n' app studio admin docs links storybook www)"
            else
              scopes=$(echo "${COMMIT_MSG:-}" | grep -oE '\[build [^]]+' | sed 's/\[build //' | tr ' ,' '\n' | tr -s '\n' || true)
              if [ -n "$scopes" ]; then
                echo "Found scoped build request: $(echo "$scopes" | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
              else
                echo "No [build] tag found — nothing to deploy"
              fi

              set_outputs_from_scopes "$scopes"
            fi
          fi

          echo "any-deploy=$ANY" >> "$GITHUB_OUTPUT"
