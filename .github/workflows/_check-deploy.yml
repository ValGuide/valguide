# Reusable workflow: parse commit message [build ...] tags and determine
# which apps to deploy and the target environment.

name: _check-deploy

on:
  workflow_call:
    inputs:
      manual_environment:
        required: false
        type: string
        default: ''
      manual_scope:
        required: false
        type: string
        default: ''
    outputs:
      environment:
        value: ${{ jobs.check.outputs.environment }}
      deploy-app:
        value: ${{ jobs.check.outputs.deploy-app }}
      deploy-studio:
        value: ${{ jobs.check.outputs.deploy-studio }}
      deploy-admin:
        value: ${{ jobs.check.outputs.deploy-admin }}
      deploy-docs:
        value: ${{ jobs.check.outputs.deploy-docs }}
      deploy-links:
        value: ${{ jobs.check.outputs.deploy-links }}
      deploy-storybook:
        value: ${{ jobs.check.outputs.deploy-storybook }}
      deploy-www:
        value: ${{ jobs.check.outputs.deploy-www }}
      deploy-workers:
        value: ${{ jobs.check.outputs.deploy-workers }}
      any-deploy:
        value: ${{ jobs.check.outputs.any-deploy }}
      timestamp:
        value: ${{ jobs.check.outputs.timestamp }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.check.outputs.environment }}
      deploy-app: ${{ steps.check.outputs.deploy-app }}
      deploy-studio: ${{ steps.check.outputs.deploy-studio }}
      deploy-admin: ${{ steps.check.outputs.deploy-admin }}
      deploy-docs: ${{ steps.check.outputs.deploy-docs }}
      deploy-links: ${{ steps.check.outputs.deploy-links }}
      deploy-storybook: ${{ steps.check.outputs.deploy-storybook }}
      deploy-www: ${{ steps.check.outputs.deploy-www }}
      deploy-workers: ${{ steps.check.outputs.deploy-workers }}
      any-deploy: ${{ steps.check.outputs.any-deploy }}
      timestamp: ${{ steps.ts.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate deploy timestamp
        id: ts
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H%M%S)" >> $GITHUB_OUTPUT

      - name: Determine environment and apps to deploy
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          MANUAL_ENVIRONMENT: ${{ inputs.manual_environment }}
          MANUAL_SCOPE: ${{ inputs.manual_scope }}
        run: bash .github/scripts/check-deploy.sh
