# Reusable workflow: consolidated Slack deploy notification.
#
# Called by deploy.yml after all deploy jobs complete.

name: _notify-deploy

on:
  workflow_call:
    inputs:
      manifest:
        required: true
        type: string
      release-url:
        required: false
        type: string
        default: ''
      changelog:
        required: false
        type: string
        default: ''
    secrets:
      VALBOT_SLACK_TOKEN:
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Build and send Slack summary
        env:
          SLACK_TOKEN: ${{ secrets.VALBOT_SLACK_TOKEN }}
          DEPLOY_MANIFEST: ${{ inputs.manifest }}
          RELEASE_URL: ${{ inputs.release-url }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_TOKEN:-}" ]; then
            echo "VALBOT_SLACK_TOKEN is not configured; skipping Slack deploy notification."
            exit 0
          fi

          sha=$(echo "$DEPLOY_MANIFEST" | jq -r '.sha')
          sha7=$(echo "$sha" | cut -c1-7)
          actor=$(echo "$DEPLOY_MANIFEST" | jq -r '.actor')
          run_url=$(echo "$DEPLOY_MANIFEST" | jq -r '.run_url')
          environment=$(echo "$DEPLOY_MANIFEST" | jq -r '.environment')
          environment_upper=$(echo "$environment" | tr '[:lower:]' '[:upper:]')
          fail_count=$(echo "$DEPLOY_MANIFEST" | jq -r '.failed_count')
          fail_names=$(echo "$DEPLOY_MANIFEST" | jq -r '.failed | join(", ")')
          lines=$(echo "$DEPLOY_MANIFEST" | jq -r '
            .targets[]
            | (if .result == "success" then "✅" else "❌" end)
              + "  `" + .name + "`"
              + (if .url == "" then "" else "  <" + .url + "|" + (.url | sub("^https://"; "")) + ">" end)
          ')

          if [ "$fail_count" -gt 0 ]; then
            header="🚨 *Deploy Finished — ${environment_upper}* (${fail_count} failed)"
            plain_header="🚨 Deploy Finished — ${environment_upper} (${fail_count} failed)"
          else
            header="🚀 *Deploy Complete — ${environment_upper}*"
            plain_header="🚀 Deploy Complete — ${environment_upper}"
          fi

          message=$(printf "%s\n\`%s\` by @%s\n\n%s" "$header" "$sha7" "$actor" "$lines")

          if [ "$fail_count" -gt 0 ]; then
            footer_text="_Failed: ${fail_names}_  •  <${run_url}|View Run>"
          else
            footer_text="<${run_url}|View Run>"
          fi

          if [ -n "${RELEASE_URL:-}" ]; then
            footer_text="📋 <${RELEASE_URL}|Full Release Notes>  •  ${footer_text}"
          fi

          changelog_block=""
          if [ -n "${CHANGELOG:-}" ]; then
            slack_changelog=$(echo -e "$CHANGELOG" \
              | sed -E 's/^### (.+)/*\1*/' \
              | sed 's/^- /• /' \
              | sed -E 's/^(• )[a-z]+(\([^)]*\))?!?: /\1/' \
              | sed -E 's/\[([^]]+)\]\(([^)]+)\)/<\2|\1>/g' \
              | sed '/^$/d' \
              | awk '/^\*[^*]/ && NR>1 {print ""} {print}')

            total_lines=$(echo "$slack_changelog" | wc -l | tr -d ' ')
            max_lines=14
            if [ "$total_lines" -gt "$max_lines" ]; then
              slack_changelog=$(echo "$slack_changelog" | head -n "$max_lines")
              remaining=$((total_lines - max_lines))
              if [ -n "${RELEASE_URL:-}" ]; then
                slack_changelog=$(printf "%s\n_…+%d more_ — <${RELEASE_URL}|see full changelog>" "$slack_changelog" "$remaining")
              fi
            fi

            changelog_block=$(printf "*Changelog*\n%s" "$slack_changelog")
          fi

          plain=$(printf "%s\nCommit: %s by @%s" "$plain_header" "$sha7" "$actor")

          if [ "$environment" = "prod" ]; then
            slack_channel="deployments"
          else
            slack_channel="deployments-dev"
          fi

          jq -n \
            --arg channel "$slack_channel" \
            --arg text "$plain" \
            --arg body "$message" \
            --arg changelog "$changelog_block" \
            --arg footer "$footer_text" \
            '{
              channel: $channel,
              text: $text,
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: $body } },
                (if ($changelog | length) > 0 then
                  { type: "section", text: { type: "mrkdwn", text: $changelog } }
                else empty end),
                { type: "section", text: { type: "mrkdwn", text: $footer } },
                { type: "divider" }
              ]
            }' | curl -sf -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer ${SLACK_TOKEN:?SLACK_TOKEN is required}" \
              -H "Content-Type: application/json" \
              -d @- || {
                echo "Slack deploy notification failed; continuing because deploy already completed."
                exit 0
              }
