# Reusable workflow: consolidated Slack deploy notification.
#
# Called by deploy.yml after all deploy jobs complete.

name: _notify-deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      deploy-app:
        required: true
        type: string
      deploy-studio:
        required: true
        type: string
      deploy-admin:
        required: true
        type: string
      deploy-docs:
        required: true
        type: string
      deploy-links:
        required: true
        type: string
      deploy-storybook:
        required: true
        type: string
      deploy-www:
        required: true
        type: string
      deploy-workers:
        required: true
        type: string
      result-app:
        required: true
        type: string
      result-studio:
        required: true
        type: string
      result-admin:
        required: true
        type: string
      result-docs:
        required: true
        type: string
      result-links:
        required: true
        type: string
      result-storybook:
        required: true
        type: string
      result-www:
        required: true
        type: string
      result-workers:
        required: true
        type: string
      release-url:
        required: false
        type: string
        default: ''
      changelog:
        required: false
        type: string
        default: ''
    secrets:
      VALBOT_SLACK_TOKEN:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Build and send Slack summary
        env:
          SLACK_TOKEN: ${{ secrets.VALBOT_SLACK_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ inputs.release-url }}
          CHANGELOG: ${{ inputs.changelog }}
          DEPLOY_APP: ${{ inputs.deploy-app }}
          DEPLOY_STUDIO: ${{ inputs.deploy-studio }}
          DEPLOY_ADMIN: ${{ inputs.deploy-admin }}
          DEPLOY_DOCS: ${{ inputs.deploy-docs }}
          DEPLOY_LINKS: ${{ inputs.deploy-links }}
          DEPLOY_STORYBOOK: ${{ inputs.deploy-storybook }}
          DEPLOY_WWW: ${{ inputs.deploy-www }}
          DEPLOY_WORKERS: ${{ inputs.deploy-workers }}
          RESULT_APP: ${{ inputs.result-app }}
          RESULT_STUDIO: ${{ inputs.result-studio }}
          RESULT_ADMIN: ${{ inputs.result-admin }}
          RESULT_DOCS: ${{ inputs.result-docs }}
          RESULT_LINKS: ${{ inputs.result-links }}
          RESULT_STORYBOOK: ${{ inputs.result-storybook }}
          RESULT_WWW: ${{ inputs.result-www }}
          RESULT_WORKERS: ${{ inputs.result-workers }}
        run: bash .github/scripts/notify-deploy.sh
