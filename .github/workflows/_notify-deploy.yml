# Reusable workflow: consolidated Slack deploy notification.
#
# Called by deploy.yml after all deploy jobs complete.

name: _notify-deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      deploy-app:
        required: true
        type: string
      deploy-studio:
        required: true
        type: string
      deploy-admin:
        required: true
        type: string
      deploy-docs:
        required: true
        type: string
      deploy-links:
        required: true
        type: string
      deploy-storybook:
        required: true
        type: string
      deploy-www:
        required: true
        type: string
      deploy-workers:
        required: true
        type: string
      result-app:
        required: true
        type: string
      result-studio:
        required: true
        type: string
      result-admin:
        required: true
        type: string
      result-docs:
        required: true
        type: string
      result-links:
        required: true
        type: string
      result-storybook:
        required: true
        type: string
      result-www:
        required: true
        type: string
      result-workers:
        required: true
        type: string
      release-url:
        required: false
        type: string
        default: ''
      changelog:
        required: false
        type: string
        default: ''
    secrets:
      VALBOT_SLACK_TOKEN:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Build and send Slack summary
        env:
          SLACK_TOKEN: ${{ secrets.VALBOT_SLACK_TOKEN }}
          ENV: ${{ inputs.environment }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ inputs.release-url }}
          CHANGELOG: ${{ inputs.changelog }}
          DEPLOY_APP: ${{ inputs.deploy-app }}
          DEPLOY_STUDIO: ${{ inputs.deploy-studio }}
          DEPLOY_ADMIN: ${{ inputs.deploy-admin }}
          DEPLOY_DOCS: ${{ inputs.deploy-docs }}
          DEPLOY_LINKS: ${{ inputs.deploy-links }}
          DEPLOY_STORYBOOK: ${{ inputs.deploy-storybook }}
          DEPLOY_WWW: ${{ inputs.deploy-www }}
          DEPLOY_WORKERS: ${{ inputs.deploy-workers }}
          RESULT_APP: ${{ inputs.result-app }}
          RESULT_STUDIO: ${{ inputs.result-studio }}
          RESULT_ADMIN: ${{ inputs.result-admin }}
          RESULT_DOCS: ${{ inputs.result-docs }}
          RESULT_LINKS: ${{ inputs.result-links }}
          RESULT_STORYBOOK: ${{ inputs.result-storybook }}
          RESULT_WWW: ${{ inputs.result-www }}
          RESULT_WORKERS: ${{ inputs.result-workers }}
        run: |
          SHA7="${GITHUB_SHA:0:7}"
          ENV_UPPER=$(echo "$ENV" | tr '[:lower:]' '[:upper:]')

          # URL lookup by display name
          url_for() {
            case "$1" in
              app-prod)    echo "https://app.valguide.com" ;;
              app-dev)     echo "https://app.valguide.dev" ;;
              studio-prod) echo "https://studio.valguide.com" ;;
              studio-dev)  echo "https://studio.valguide.dev" ;;
              admin-prod)  echo "https://ops.val.guide" ;;
              admin-dev)   echo "https://ops-dev.val.guide" ;;
              docs-prod)   echo "https://docs.val.guide" ;;
              docs-dev)    echo "https://docs-dev.val.guide" ;;
              links-prod)  echo "https://links.valguide.com" ;;
              links-dev)   echo "https://links.valguide.dev" ;;
              storybook-prod) echo "https://sb.val.guide" ;;
              storybook-dev)  echo "https://sb-dev.val.guide" ;;
              www-prod)    echo "https://www.valguide.com" ;;
              www-dev)     echo "https://www.valguide.dev" ;;
            esac
          }

          LINES=""
          FAIL_COUNT=0
          FAIL_NAMES=""

          add_line() {
            local should=$1 result=$2 display_name=$3
            if [ "$should" != "true" ]; then return; fi
            local url suffix
            url=$(url_for "${display_name}-${ENV}")
            if [ -n "$url" ]; then
              suffix="  <${url}|${url#https://}>"
            else
              suffix=""
            fi
            if [ "$result" = "success" ]; then
              LINES="${LINES}✅  \`${display_name}\`${suffix}\n"
            else
              LINES="${LINES}❌  \`${display_name}\`${suffix}\n"
              FAIL_NAMES="${FAIL_NAMES}${display_name}, "
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          }

          add_line "$DEPLOY_APP"       "$RESULT_APP"       "app"
          add_line "$DEPLOY_STUDIO"    "$RESULT_STUDIO"    "studio"
          add_line "$DEPLOY_ADMIN"     "$RESULT_ADMIN"     "admin"
          add_line "$DEPLOY_DOCS"      "$RESULT_DOCS"      "docs"
          add_line "$DEPLOY_LINKS"     "$RESULT_LINKS"     "links"
          add_line "$DEPLOY_STORYBOOK" "$RESULT_STORYBOOK" "storybook"
          add_line "$DEPLOY_WWW"       "$RESULT_WWW"       "www"
          add_line "$DEPLOY_WORKERS"   "$RESULT_WORKERS"   "workers"

          # Build header (rich text for body, plain for notification fallback)
          if [ "$FAIL_COUNT" -gt 0 ]; then
            HEADER="🚨 *Deploy Finished — ${ENV_UPPER}* (${FAIL_COUNT} failed)"
            PLAIN_HEADER="🚨 Deploy Finished — ${ENV_UPPER} (${FAIL_COUNT} failed)"
            FAIL_NAMES="${FAIL_NAMES%, }"
          else
            HEADER="🚀 *Deploy Complete — ${ENV_UPPER}*"
            PLAIN_HEADER="🚀 Deploy Complete — ${ENV_UPPER}"
          fi

          MSG=$(echo -e "${HEADER}\n\`${SHA7}\` by @${ACTOR}\n\n${LINES}")

          if [ "$FAIL_COUNT" -gt 0 ]; then
            FOOTER_TEXT="_Failed: ${FAIL_NAMES}_  •  <${RUN_URL}|View Run>"
          else
            FOOTER_TEXT="<${RUN_URL}|View Run>"
          fi

          # Add release link to footer if available
          if [ -n "$RELEASE_URL" ]; then
            FOOTER_TEXT="📋 <${RELEASE_URL}|Full Release Notes>  •  ${FOOTER_TEXT}"
          fi

          # Build changelog block for Slack (bullet list with • prefix)
          CHANGELOG_BLOCK=""
          if [ -n "$CHANGELOG" ]; then
            # Convert markdown to Slack mrkdwn:
            # - ### headers → *bold*
            # - markdown links [text](url) → <url|text>
            # - bullet dashes → •
            # - strip conventional commit prefixes (e.g. "feat(scope)!: msg" → "msg")
            SLACK_CHANGELOG=$(echo -e "$CHANGELOG" \
              | sed -E 's/^### (.+)/*\1*/' \
              | sed 's/^- /• /' \
              | sed -E 's/^(• )[a-z]+(\([^)]*\))?!?: /\1/' \
              | sed -E 's/\[([^]]+)\]\(([^)]+)\)/<\2|\1>/g' \
              | sed '/^$/d' \
              | awk '/^\*[^*]/ && NR>1 {print ""} {print}')

            # Limit to first MAX_LINES to keep message compact
            TOTAL_LINES=$(echo "$SLACK_CHANGELOG" | wc -l | tr -d ' ')
            MAX_LINES=14
            if [ "$TOTAL_LINES" -gt "$MAX_LINES" ]; then
              SLACK_CHANGELOG=$(echo "$SLACK_CHANGELOG" | head -n "$MAX_LINES")
              REMAINING=$((TOTAL_LINES - MAX_LINES))
              if [ -n "$RELEASE_URL" ]; then
                SLACK_CHANGELOG=$(printf "%s\n_…+%d more_ — <${RELEASE_URL}|see full changelog>" "$SLACK_CHANGELOG" "$REMAINING")
              fi
            fi

            CHANGELOG_BLOCK=$(printf "*Changelog*\n%s" "$SLACK_CHANGELOG")
          fi

          # Fallback plain text for notifications (no mrkdwn formatting)
          PLAIN=$(echo -e "${PLAIN_HEADER}\nCommit: ${SHA7} by @${ACTOR}")

          # Send via Slack API (jq handles JSON escaping reliably)
          # Build blocks array dynamically — changelog block included only if non-empty
          jq -n \
            --arg channel "deployments" \
            --arg text "$PLAIN" \
            --arg body "$MSG" \
            --arg changelog "$CHANGELOG_BLOCK" \
            --arg footer "$FOOTER_TEXT" \
            '{
              channel: $channel,
              text: $text,
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: $body } },
                (if ($changelog | length) > 0 then
                  { type: "section", text: { type: "mrkdwn", text: $changelog } }
                else empty end),
                { type: "section", text: { type: "mrkdwn", text: $footer } },
                { type: "divider" }
              ]
            }' | curl -sf -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_TOKEN" \
              -H "Content-Type: application/json" \
              -d @-
