# Reusable workflow: deploy all Cloudflare Workers.
#
# Loops over workers/*/ directories and runs deploy/deploy:dev
# for each one. Adding a new worker only requires creating the
# directory with a package.json that has deploy/deploy:dev scripts.
#
# Triggered via [build workers] or [build all] in the commit message.

name: _deploy-workers

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Environment (dev or prod)"
      timestamp:
        required: true
        type: string
        description: "Deploy timestamp (shared across all jobs)"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: workers-${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Deploy all workers
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: bash .github/scripts/deploy-workers.sh

      - uses: ./.github/actions/create-app-tag
        with:
          app-name: workers
          environment: ${{ inputs.environment }}
          timestamp: ${{ inputs.timestamp }}
