# Reusable workflow: create a lightweight per-app git tag after a successful deploy.
#
# Creates a git tag ({app}-{env}-{TS}-{sha}) without a GitHub Release.
# Tags are useful for deploy history, rollback reference, and per-app filtering.

name: Create App Tag

on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
        description: "Lowercase app name (app, studio, admin, etc.)"
      environment:
        required: true
        type: string
        description: "Environment (dev or prod)"
      timestamp:
        required: true
        type: string
        description: "Deploy timestamp (shared across all jobs)"

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create and push tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="${{ inputs.app-name }}-${{ inputs.environment }}-${{ inputs.timestamp }}-${SHORT_SHA}"
          git tag "$TAG"
          git push origin "$TAG"
