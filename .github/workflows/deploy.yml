# Unified deploy orchestrator.
#
# Parses commit message tags like [build app], [build app,studio], [build all],
# deploys matching apps in parallel via reusable sub-workflows, sends ONE
# consolidated Slack notification, and creates GitHub Releases on success.
#
# Required GitHub Secrets:
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers deploy permissions
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#   VALBOT_SLACK_TOKEN    — Slack Bot Token (xoxb-…) with chat:write scope

name: Deploy

on:
  push:
    branches: [main, dev]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── Check which apps to deploy ──────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.check.outputs.environment }}
      deploy-app: ${{ steps.check.outputs.deploy-app }}
      deploy-studio: ${{ steps.check.outputs.deploy-studio }}
      deploy-admin: ${{ steps.check.outputs.deploy-admin }}
      deploy-docs: ${{ steps.check.outputs.deploy-docs }}
      deploy-links: ${{ steps.check.outputs.deploy-links }}
      deploy-storybook: ${{ steps.check.outputs.deploy-storybook }}
      deploy-www: ${{ steps.check.outputs.deploy-www }}
      any-deploy: ${{ steps.check.outputs.any-deploy }}
    steps:
      - id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Determine environment from branch
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

          APPS="app studio admin docs links storybook www"
          ANY=false

          if echo "$COMMIT_MSG" | grep -qF '[build all]'; then
            echo "✅ [build all] found — deploying everything"
            for app in $APPS; do
              echo "deploy-${app}=true" >> $GITHUB_OUTPUT
            done
            ANY=true
          else
            SCOPES=$(echo "$COMMIT_MSG" | grep -oE '\[build [^]]+' | sed 's/\[build //' | tr ' ,' '\n' | tr -s '\n')
            if [ -n "$SCOPES" ]; then
              echo "Found scoped build request: $(echo $SCOPES | tr '\n' ' ')"
            else
              echo "No [build] tag found — nothing to deploy"
            fi
            for app in $APPS; do
              if echo "$SCOPES" | grep -qx "$app"; then
                echo "deploy-${app}=true" >> $GITHUB_OUTPUT
                ANY=true
              else
                echo "deploy-${app}=false" >> $GITHUB_OUTPUT
              fi
            done
          fi

          echo "any-deploy=$ANY" >> $GITHUB_OUTPUT

  # ── Deploy jobs (parallel) ──────────────────────────────────────────
  deploy-app:
    needs: check
    if: needs.check.outputs.deploy-app == 'true'
    uses: ./.github/workflows/_deploy-app.yml
    with:
      environment: ${{ needs.check.outputs.environment }}
    secrets: inherit

  deploy-studio:
    needs: check
    if: needs.check.outputs.deploy-studio == 'true'
    uses: ./.github/workflows/_deploy-studio.yml
    with:
      environment: ${{ needs.check.outputs.environment }}
    secrets: inherit

  deploy-admin:
    needs: check
    if: needs.check.outputs.deploy-admin == 'true'
    uses: ./.github/workflows/_deploy-admin.yml
    with:
      environment: ${{ needs.check.outputs.environment }}
    secrets: inherit

  deploy-docs:
    needs: check
    if: needs.check.outputs.deploy-docs == 'true'
    uses: ./.github/workflows/_deploy-docs.yml
    with:
      environment: ${{ needs.check.outputs.environment }}
    secrets: inherit

  deploy-links:
    needs: check
    if: needs.check.outputs.deploy-links == 'true'
    uses: ./.github/workflows/_deploy-links.yml
    with:
      environment: ${{ needs.check.outputs.environment }}
    secrets: inherit

  deploy-storybook:
    needs: check
    if: needs.check.outputs.deploy-storybook == 'true'
    uses: ./.github/workflows/_deploy-storybook.yml
    with:
      environment: ${{ needs.check.outputs.environment }}
    secrets: inherit

  deploy-www:
    needs: check
    if: needs.check.outputs.deploy-www == 'true'
    uses: ./.github/workflows/_deploy-www.yml
    with:
      environment: ${{ needs.check.outputs.environment }}
    secrets: inherit

  # ── Consolidated Slack notification ─────────────────────────────────
  notify:
    needs: [check, deploy-app, deploy-studio, deploy-admin, deploy-docs, deploy-links, deploy-storybook, deploy-www]
    if: always() && needs.check.outputs.any-deploy == 'true'
    uses: ./.github/workflows/_notify-deploy.yml
    with:
      environment: ${{ needs.check.outputs.environment }}
      deploy-app: ${{ needs.check.outputs.deploy-app }}
      deploy-studio: ${{ needs.check.outputs.deploy-studio }}
      deploy-admin: ${{ needs.check.outputs.deploy-admin }}
      deploy-docs: ${{ needs.check.outputs.deploy-docs }}
      deploy-links: ${{ needs.check.outputs.deploy-links }}
      deploy-storybook: ${{ needs.check.outputs.deploy-storybook }}
      deploy-www: ${{ needs.check.outputs.deploy-www }}
      result-app: ${{ needs.deploy-app.result }}
      result-studio: ${{ needs.deploy-studio.result }}
      result-admin: ${{ needs.deploy-admin.result }}
      result-docs: ${{ needs.deploy-docs.result }}
      result-links: ${{ needs.deploy-links.result }}
      result-storybook: ${{ needs.deploy-storybook.result }}
      result-www: ${{ needs.deploy-www.result }}
    secrets:
      VALBOT_SLACK_TOKEN: ${{ secrets.VALBOT_SLACK_TOKEN }}

  # ── GitHub Releases (per-app, on success) ───────────────────────────
  release-app:
    needs: [check, deploy-app]
    if: needs.deploy-app.result == 'success'
    uses: ./.github/workflows/create-release.yml
    with:
      app-name: app
      app-display-name: App
      environment: ${{ needs.check.outputs.environment }}
      url: ${{ needs.deploy-app.outputs.url }}

  release-studio:
    needs: [check, deploy-studio]
    if: needs.deploy-studio.result == 'success'
    uses: ./.github/workflows/create-release.yml
    with:
      app-name: studio
      app-display-name: Studio
      environment: ${{ needs.check.outputs.environment }}
      url: ${{ needs.deploy-studio.outputs.url }}

  release-admin:
    needs: [check, deploy-admin]
    if: needs.deploy-admin.result == 'success'
    uses: ./.github/workflows/create-release.yml
    with:
      app-name: admin
      app-display-name: Admin
      environment: ${{ needs.check.outputs.environment }}
      url: ${{ needs.deploy-admin.outputs.url }}

  release-docs:
    needs: [check, deploy-docs]
    if: needs.deploy-docs.result == 'success'
    uses: ./.github/workflows/create-release.yml
    with:
      app-name: docs
      app-display-name: Docs
      environment: ${{ needs.check.outputs.environment }}
      url: ${{ needs.deploy-docs.outputs.url }}

  release-links:
    needs: [check, deploy-links]
    if: needs.deploy-links.result == 'success'
    uses: ./.github/workflows/create-release.yml
    with:
      app-name: links
      app-display-name: Links
      environment: ${{ needs.check.outputs.environment }}
      url: ${{ needs.deploy-links.outputs.url }}

  release-storybook:
    needs: [check, deploy-storybook]
    if: needs.deploy-storybook.result == 'success'
    uses: ./.github/workflows/create-release.yml
    with:
      app-name: storybook
      app-display-name: Storybook
      environment: ${{ needs.check.outputs.environment }}
      url: ${{ needs.deploy-storybook.outputs.url }}

  release-www:
    needs: [check, deploy-www]
    if: needs.deploy-www.result == 'success'
    uses: ./.github/workflows/create-release.yml
    with:
      app-name: www
      app-display-name: www
      environment: ${{ needs.check.outputs.environment }}
      url: ${{ needs.deploy-www.outputs.url }}
