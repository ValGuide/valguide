# Unified deploy orchestrator.
#
# Parses commit message tags like [build app], [build app,studio], [build workers], [build apps], [build all],
# deploys matching targets in parallel via a matrix, sends ONE
# consolidated Slack notification, and creates GitHub Releases on success.
#
# Required GitHub Secrets:
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers deploy permissions
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#   VALBOT_SLACK_TOKEN    — Slack Bot Token (xoxb-…) with chat:write scope

name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - prod
      scope:
        description: Deploy scope. Supports all, apps, or app names like "studio app" / "studio,app"
        required: true
        type: string
        default: all

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.ref_name, inputs.environment) || github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  # ── Check which apps to deploy ──────────────────────────────────────
  check:
    uses: ./.github/workflows/_check-deploy.yml
    with:
      manual_environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || '' }}
      manual_scope: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || '' }}

  # ── Deploy jobs (parallel) ──────────────────────────────────────────
  deploy-targets:
    needs: check
    if: needs.check.outputs.any-deploy == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.check.outputs.targets-json) }}
    uses: ./.github/workflows/_deploy.yml
    with:
      app-name: ${{ matrix.target }}
      environment: ${{ needs.check.outputs.environment }}
    secrets: inherit

  # ── Aggregate matrix results ────────────────────────────────────────
  aggregate:
    needs: [check, deploy-targets]
    if: always() && !cancelled() && needs.check.outputs.any-deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      manifest: ${{ steps.manifest.outputs.manifest }}
      failed-count: ${{ steps.manifest.outputs.failed-count }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deploy-result-*
          path: deploy-results
          merge-multiple: true

      - name: Build deploy manifest
        id: manifest
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.check.outputs.environment }}
          DEPLOY_TIMESTAMP: ${{ needs.check.outputs.timestamp }}
          TARGETS_JSON: ${{ needs.check.outputs.targets-json }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          missing=""
          for target in $(echo "$TARGETS_JSON" | jq -r '.[]'); do
            if [ ! -f "deploy-results/${target}.json" ]; then
              missing="${missing} ${target}"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::Missing deploy result artifact(s):${missing}"
            exit 1
          fi

          manifest=$(jq -c -n \
            --arg environment "$DEPLOY_ENVIRONMENT" \
            --arg timestamp "$DEPLOY_TIMESTAMP" \
            --arg actor "${{ github.actor }}" \
            --arg sha "${{ github.sha }}" \
            --arg run_url "$RUN_URL" \
            --argjson requested "$TARGETS_JSON" \
            --slurpfile targets <(jq -s '
              . as $items
              | $requested
              | map(. as $name | $items[] | select(.name == $name))
            ' --argjson requested "$TARGETS_JSON" deploy-results/*.json) \
            '{
              environment: $environment,
              timestamp: $timestamp,
              actor: $actor,
              sha: $sha,
              run_url: $run_url,
              targets: $targets[0],
              failed: ($targets[0] | map(select(.result != "success") | .name)),
              failed_count: ($targets[0] | map(select(.result != "success")) | length)
            }')

          failed_count=$(echo "$manifest" | jq -r '.failed_count')

          {
            echo "manifest<<EOF"
            echo "$manifest"
            echo "EOF"
            echo "failed-count=${failed_count}"
          } >> "$GITHUB_OUTPUT"

  # ── Consolidated GitHub Release ─────────────────────────────────────
  release:
    needs: [check, aggregate]
    if: "!cancelled() && needs.check.outputs.any-deploy == 'true' && needs.aggregate.result == 'success'"
    uses: ./.github/workflows/release.yml
    with:
      manifest: ${{ needs.aggregate.outputs.manifest }}

  # ── Consolidated Slack notification ─────────────────────────────────
  notify:
    needs: [check, aggregate, release]
    if: always() && !cancelled() && needs.check.outputs.any-deploy == 'true' && needs.aggregate.result == 'success'
    uses: ./.github/workflows/_notify-deploy.yml
    with:
      manifest: ${{ needs.aggregate.outputs.manifest }}
      release-url: ${{ needs.release.outputs.release-url }}
      changelog: ${{ needs.release.outputs.changelog }}
    secrets:
      VALBOT_SLACK_TOKEN: ${{ secrets.VALBOT_SLACK_TOKEN }}

  complete:
    needs: [check, aggregate, release, notify]
    if: always() && !cancelled() && needs.check.outputs.any-deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy result
        env:
          FAILED_COUNT: ${{ needs.aggregate.outputs.failed-count }}
          RELEASE_RESULT: ${{ needs.release.result }}
          NOTIFY_RESULT: ${{ needs.notify.result }}
        run: |
          set -euo pipefail

          if [ "$RELEASE_RESULT" != "success" ]; then
            echo "::error::Release job finished with result: ${RELEASE_RESULT}"
            exit 1
          fi

          if [ "$NOTIFY_RESULT" != "success" ]; then
            echo "::error::Notify job finished with result: ${NOTIFY_RESULT}"
            exit 1
          fi

          if [ "${FAILED_COUNT:-0}" -gt 0 ]; then
            echo "::error::${FAILED_COUNT} deploy target(s) failed."
            exit 1
          fi
