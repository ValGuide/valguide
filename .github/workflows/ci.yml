name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for committed secrets
        run: pnpm secrets:check

      - name: Resolve Nx affected SHAs
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            nx_base="${{ github.event.pull_request.base.sha }}"
            nx_head="${{ github.event.pull_request.head.sha }}"
            fallback_ref="origin/${{ github.event.pull_request.base.ref }}"

            git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}" || true
          else
            nx_base="${{ github.event.before }}"
            nx_head="${{ github.sha }}"
            fallback_ref="origin/${{ github.ref_name }}"

            git fetch --no-tags origin "${{ github.ref_name }}" || true
          fi

          if ! git cat-file -e "$nx_head^{commit}" 2>/dev/null; then
            nx_head="HEAD"
          fi

          if ! git cat-file -e "$nx_base^{commit}" 2>/dev/null; then
            echo "NX base $nx_base is not available; falling back to merge-base with $fallback_ref."
            if [ "${{ github.event_name }}" != "pull_request" ] && git rev-parse "$nx_head^" >/dev/null 2>&1; then
              nx_base="$(git rev-parse "$nx_head^")"
            else
              nx_base="$(git merge-base "$fallback_ref" "$nx_head")"
            fi
          fi

          echo "NX_BASE=$nx_base" >> "$GITHUB_ENV"
          echo "NX_HEAD=$nx_head" >> "$GITHUB_ENV"

      - name: Lint repo
        run: pnpm lint:error

      - name: Type-check root TypeScript config
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Run affected project checks
        run: |
          pnpm exec nx affected -t type-check,build,test --base="$NX_BASE" --head="$NX_HEAD"
