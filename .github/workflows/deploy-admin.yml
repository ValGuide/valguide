# Deploy Admin to Cloudflare Workers
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers deploy permissions
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#
# Runtime secrets (DATABASE_URL, SUPABASE_SECRET_KEY, etc.) are pushed
# separately via `wrangler secret put` — NOT managed by CI.
#
# Triggered by commit message tags:
#   [build admin]         — deploy admin
#   [build admin,studio]  — deploy admin (and studio in its own workflow)
#   [build all]           — deploy all apps

name: Deploy Admin

on:
  push:
    branches: [main, dev]

concurrency:
  group: deploy-admin-${{ github.ref }}
  cancel-in-progress: true
  
permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/check-deploy.yml
    with:
      app-name: admin

  deploy-prod:
    needs: check
    if: needs.check.outputs.should_deploy == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: admin-prod
      url: https://ops.val.guide
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_POSTHOG_ENABLED: "true"
      VITE_POSTHOG_KEY: <public-posthog-project-key>
      VITE_POSTHOG_HOST: https://e.valguide.com
      VITE_STUDIO_URL: https://studio.valguide.com
      VITE_APP_DOMAIN: app.valguide.com
      VITE_R2_PUBLIC_URL: https://assets.valguide.com
      VITE_ENV: prod
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build & Deploy
        run: pnpm --filter @valguide/admin run deploy

  notify-prod:
    needs: [check, deploy-prod]
    if: always() && needs.check.outputs.should_deploy == 'true' && needs.deploy-prod.result != 'skipped'
    uses: ./.github/workflows/notify-slack.yml
    with:
      app-name: Admin
      environment: prod
      url: https://ops.val.guide
      status: ${{ needs.deploy-prod.result }}
    secrets:
      VALBOT_SLACK_TOKEN: ${{ secrets.VALBOT_SLACK_TOKEN }}

  deploy-dev:
    needs: check
    if: needs.check.outputs.should_deploy == 'true' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: admin-dev
      url: https://ops-dev.val.guide
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_POSTHOG_ENABLED: "true"
      VITE_POSTHOG_KEY: <public-posthog-project-key>
      VITE_POSTHOG_HOST: https://e.valguide.dev
      VITE_STUDIO_URL: https://studio.valguide.dev
      VITE_APP_DOMAIN: app.valguide.dev
      VITE_R2_PUBLIC_URL: https://assets.valguide.dev
      VITE_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build & Deploy
        run: pnpm --filter @valguide/admin run deploy:dev

  notify-dev:
    needs: [check, deploy-dev]
    if: always() && needs.check.outputs.should_deploy == 'true' && needs.deploy-dev.result != 'skipped'
    uses: ./.github/workflows/notify-slack.yml
    with:
      app-name: Admin
      environment: dev
      url: https://ops-dev.val.guide
      status: ${{ needs.deploy-dev.result }}
    secrets:
      VALBOT_SLACK_TOKEN: ${{ secrets.VALBOT_SLACK_TOKEN }}

  release-prod:
    needs: [check, deploy-prod]
    if: needs.deploy-prod.result == 'success'
    uses: ./.github/workflows/create-release.yml
    with:
      app-name: admin
      app-display-name: Admin
      environment: prod
      url: https://ops.val.guide

  release-dev:
    needs: [check, deploy-dev]
    if: needs.deploy-dev.result == 'success'
    uses: ./.github/workflows/create-release.yml
    with:
      app-name: admin
      app-display-name: Admin
      environment: dev
      url: https://ops-dev.val.guide
