# Deploy Admin to Cloudflare Workers
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers deploy permissions
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#
# Runtime secrets (DATABASE_URL, SUPABASE_SECRET_KEY, etc.) are pushed
# separately via `wrangler secret put` — NOT managed by CI.
#
# Triggered by commit message tags:
#   [build admin]         — deploy admin
#   [build admin,studio]  — deploy admin (and studio in its own workflow)
#   [build all]           — deploy all apps

name: Deploy Admin

on:
  push:
    branches: [main, dev]

concurrency:
  group: deploy-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ops.val.guide
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_POSTHOG_ENABLED: "true"
      VITE_POSTHOG_KEY: <public-posthog-project-key>
      VITE_POSTHOG_HOST: https://e.valguide.com
      VITE_STUDIO_URL: https://studio.valguide.com
      VITE_APP_DOMAIN: app.valguide.com
      VITE_ENV: prod
    steps:
      - uses: actions/checkout@v4

      - name: Check if admin should deploy
        id: check
        run: |
          if node scripts/should-deploy.mjs admin; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.should_deploy == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.should_deploy == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.should_deploy == 'true'

      - name: Build & Deploy
        if: steps.check.outputs.should_deploy == 'true'
        run: pnpm --filter @valguide/admin run deploy

  notify-prod:
    needs: deploy-prod
    if: always() && needs.deploy-prod.outputs.should_deploy == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      app-name: Admin
      environment: production
      url: https://ops.val.guide
      status: ${{ needs.deploy-prod.result }}
    secrets:
      VALBOT_SLACK_TOKEN: ${{ secrets.VALBOT_SLACK_TOKEN }}

  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://ops-dev.val.guide
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_POSTHOG_ENABLED: "true"
      VITE_POSTHOG_KEY: <public-posthog-project-key>
      VITE_POSTHOG_HOST: https://e.valguide.dev
      VITE_STUDIO_URL: https://studio.valguide.dev
      VITE_APP_DOMAIN: app.valguide.dev
      VITE_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - name: Check if admin should deploy
        id: check
        run: |
          if node scripts/should-deploy.mjs admin; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.should_deploy == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.should_deploy == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.should_deploy == 'true'

      - name: Build & Deploy
        if: steps.check.outputs.should_deploy == 'true'
        run: pnpm --filter @valguide/admin run deploy:dev

  notify-dev:
    needs: deploy-dev
    if: always() && needs.deploy-dev.outputs.should_deploy == 'true'
    uses: ./.github/workflows/notify-slack.yml
    with:
      app-name: Admin
      environment: development
      url: https://ops-dev.val.guide
      status: ${{ needs.deploy-dev.result }}
    secrets:
      VALBOT_SLACK_TOKEN: ${{ secrets.VALBOT_SLACK_TOKEN }}
