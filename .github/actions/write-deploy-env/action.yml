name: Write deploy env
description: Write hosted deploy inputs to a masked temporary env file.
inputs:
  github-token:
    required: true
  environment-name:
    required: true
  cloudflare-api-token:
    required: false
  cloudflare-account-id:
    required: false
outputs:
  env-file:
    description: Path to the temporary env file.
runs:
  using: node20
  main: index.js
