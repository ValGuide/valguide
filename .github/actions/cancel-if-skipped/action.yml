name: Cancel if skipped
description: Cancels the workflow run if should_deploy is false

inputs:
  should_deploy:
    required: true

runs:
  using: composite
  steps:
    - if: inputs.should_deploy == 'false'
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.actions.cancelWorkflowRun({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId,
          });
          await new Promise(r => setTimeout(r, 5000));